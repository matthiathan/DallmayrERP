<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0f1419" />
  <title>DallmayrERP is offline</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; background: #0f1419; color: #f8fafc; }
    * { box-sizing: border-box; }
    body { min-height: 100dvh; margin: 0; display: grid; place-items: center; padding: 24px; background: radial-gradient(circle at top, #2b343d, #0f1419 62%); }
    main { width: min(100%, 480px); padding: 28px; border: 1px solid #71808e; border-radius: 24px; background: #20272f; box-shadow: 0 24px 72px rgba(0,0,0,.42); }
    span { display: inline-grid; place-items: center; width: 56px; height: 56px; border: 2px solid #67e8f9; border-radius: 18px; color: #67e8f9; font-size: 1.5rem; font-weight: 900; }
    h1 { margin: 22px 0 10px; font-size: clamp(1.7rem, 7vw, 2.4rem); }
    p { margin: 0 0 18px; color: #cbd5e1; line-height: 1.55; }
    button { width: 100%; min-height: 48px; border: 0; border-radius: 14px; background: #22c3dc; color: #071318; font: inherit; font-weight: 800; }
  </style>
</head>
<body>
  <main>
    <span aria-hidden="true">D</span>
    <h1>No connection</h1>
    <p>DallmayrERP could not reach the server. Reconnect and try again. Field-work drafts and queued completions remain stored on this device.</p>
    <button type="button" onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
