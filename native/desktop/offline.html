<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DallmayrERP offline</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Arial, Helvetica, sans-serif;
      }

      body {
        display: grid;
        min-height: 100vh;
        margin: 0;
        place-items: center;
        background: #f5f6f8;
        color: #111827;
      }

      main {
        width: min(440px, calc(100% - 32px));
        padding: 28px;
        border: 1px solid #d7dde5;
        border-radius: 8px;
        background: #ffffff;
      }

      h1 {
        margin: 0 0 10px;
        font-size: 24px;
      }

      p {
        margin: 0 0 18px;
        color: #526173;
        line-height: 1.5;
      }

      a {
        display: inline-flex;
        min-height: 36px;
        align-items: center;
        padding: 0 14px;
        border-radius: 4px;
        background: #0078d4;
        color: #ffffff;
        font-weight: 700;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>DallmayrERP cannot load</h1>
      <p>Check your internet connection or confirm that the hosted ERP service is available.</p>
      <a href="https://dallmayrerp.onrender.com">Try again</a>
    </main>
  </body>
</html>
