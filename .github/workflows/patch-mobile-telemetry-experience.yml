name: Apply mobile telemetry experience

on:
  push:
    branches:
      - fix/mobile-telemetry-experience-20260907
    paths:
      - '.github/workflows/patch-mobile-telemetry-experience.yml'
      - 'scripts/patch_mobile_telemetry_experience.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: fix/mobile-telemetry-experience-20260907

      - name: Apply mobile telemetry patch
        run: python scripts/patch_mobile_telemetry_experience.py

      - name: Commit patched application files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/layout/AppShell.tsx components/layout/MobileNavigation.tsx components/features/MachinesWorkspace.tsx app/responsive-mobile-tablet.css scripts/check-mobile-interactions.mjs
          git commit -m "fix: make telemetry workspace phone-first"
          git push origin HEAD:fix/mobile-telemetry-experience-20260907
