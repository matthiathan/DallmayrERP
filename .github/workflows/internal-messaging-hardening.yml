name: Internal Messaging Hardening Validation

on:
  pull_request:
    paths:
      - "components/features/SecureInternalMessagingWorkspace.tsx"
      - "app/messages/page.tsx"
      - "app/work/messages/page.tsx"
      - "lib/features/internalMessaging.ts"
      - ".env.example"
      - "next.config.ts"
      - "docs/internal-messaging/**"
      - "supabase/migrations/20260812083000_harden_internal_messaging_phase_1.sql"
      - "supabase/rollback/20260812083000_unharden_internal_messaging_phase_1.sql"
      - ".github/workflows/internal-messaging-hardening.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  postgres-hardening-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: messaging_hardening_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d messaging_hardening_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: messaging_hardening_test

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client

      - name: Apply ERP fixtures and messaging foundation
        run: |
          psql -v ON_ERROR_STOP=1 -f docs/internal-messaging/ci-fixtures.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20260804094500_add_internal_messaging_phase_1.sql

      - name: Stub Supabase Realtime authorization surface
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          create schema realtime;
          create table realtime.messages (
            id bigint generated always as identity primary key,
            extension text not null,
            topic text not null,
            event text not null,
            payload jsonb not null default '{}'::jsonb
          );
          alter table realtime.messages enable row level security;
          grant select, insert on realtime.messages to authenticated;
          grant usage, select on sequence realtime.messages_id_seq to authenticated;

          create or replace function realtime.topic()
          returns text
          language sql
          stable
          as $$
            select current_setting('realtime.topic', true)
          $$;

          create or replace function realtime.send(
            payload jsonb,
            event text,
            topic text,
            private boolean
          )
          returns void
          language plpgsql
          security definer
          set search_path = ''
          as $$
          begin
            insert into realtime.messages (extension, topic, event, payload)
            values ('broadcast', topic, event, payload);
          end;
          $$;
          SQL

      - name: Apply hardening migration
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20260812083000_harden_internal_messaging_phase_1.sql

      - name: Run positive hardening contracts
        run: psql -v ON_ERROR_STOP=1 -f docs/internal-messaging/hardening-ci-tests.sql

      - name: Verify non-member private Realtime join/write is rejected
        shell: bash
        run: |
          thread_id=$(psql -Atq -c "select id from public.message_threads where direct_key = '00000000-0000-0000-0000-000000000001:00000000-0000-0000-0000-000000000002'")
          test -n "$thread_id"
          set +e
          output=$(psql -v ON_ERROR_STOP=1 -v thread_id="$thread_id" 2>&1 <<'SQL'
          set role authenticated;
          select set_config('request.jwt.claim.sub', '10000000-0000-0000-0000-000000000003', false);
          select set_config('realtime.topic', 'thread:' || :'thread_id', false);
          insert into realtime.messages (extension, topic, event, payload)
          values ('broadcast', 'thread:' || :'thread_id', 'typing', '{"typing":true}'::jsonb);
          SQL
          )
          status=$?
          set -e
          test "$status" -ne 0
          echo "$output" | grep -qi "row-level security"

      - name: Verify membership role cannot be changed by a member
        shell: bash
        run: |
          thread_id=$(psql -Atq -c "select id from public.message_threads where direct_key = '00000000-0000-0000-0000-000000000001:00000000-0000-0000-0000-000000000002'")
          test -n "$thread_id"
          set +e
          output=$(psql -v ON_ERROR_STOP=1 -v thread_id="$thread_id" 2>&1 <<'SQL'
          set role authenticated;
          select set_config('request.jwt.claim.sub', '10000000-0000-0000-0000-000000000001', false);
          update public.message_thread_members
          set member_role = 'member'
          where thread_id = :'thread_id'::uuid
            and user_id = '00000000-0000-0000-0000-000000000001'::uuid;
          SQL
          )
          status=$?
          set -e
          test "$status" -ne 0
          echo "$output" | grep -qi "permission denied"

      - name: Verify hardening rollback
        run: |
          psql -v ON_ERROR_STOP=1 -f supabase/rollback/20260812083000_unharden_internal_messaging_phase_1.sql
          test "$(psql -Atq -c "select count(*) from pg_policies where schemaname='realtime' and tablename='messages' and policyname like 'internal_messaging_realtime_thread_%'")" = "0"
          test "$(psql -Atq -c "select count(*) from pg_policies where schemaname='public' and tablename='message_thread_members' and policyname='message_members_update_own_preferences'")" = "0"
          test "$(psql -Atq -c "select count(*) from pg_trigger t join pg_class c on c.oid=t.tgrelid join pg_namespace n on n.oid=c.relnamespace where n.nspname='public' and c.relname='messages' and t.tgname='handle_committed_internal_message' and not t.tgisinternal")" = "0"
