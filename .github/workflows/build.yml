name: Build DallmayrERP

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://egbiiizxsqlarqpnzxxs.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: dummy-build-key
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build
        shell: bash
        run: |
          set +e
          npm run build 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          exit "$status"

      - name: Upload failed build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: dallmayrerp-build-log
          path: build.log
          retention-days: 1
