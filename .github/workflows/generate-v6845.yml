name: Generate V6.8.45 durable counters

on:
  push:
    branches:
      - fix/durable-counter-persistence-v6845
    paths:
      - '.github/workflows/generate-v6845.yml'
      - 'scripts/generate_v6845.py'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: fix/durable-counter-persistence-v6845

      - name: Generate V6.8.45 from V6.8.44
        run: python scripts/generate_v6845.py

      - name: Commit generated firmware
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add firmware/DallmayrTelemetryV6_8_45/DallmayrTelemetryV6_8_45.ino
          git commit -m "fix: persist MDB counters immediately in V6.8.45"
          git push origin HEAD:fix/durable-counter-persistence-v6845
