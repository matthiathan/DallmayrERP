name: Generate V6.8.45 durable counters

on:
  push:
    branches:
      - fix/durable-counter-persistence-v6845
    paths:
      - '.github/workflows/generate-v6845.yml'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: fix/durable-counter-persistence-v6845

      - name: Generate V6.8.45 from V6.8.44
        shell: python
        run: |
          from pathlib import Path

          src = Path('firmware/DallmayrTelemetryV6_8_44/DallmayrTelemetryV6_8_44.ino')
          dst = Path('firmware/DallmayrTelemetryV6_8_45/DallmayrTelemetryV6_8_45.ino')
          text = src.read_text(encoding='utf-8')

          text = text.replace('V6.8.44', 'V6.8.45')
          text = text.replace('6.8.44-esp32s3-air780eu-mdb-rmt-idle-tail', '6.8.45-esp32s3-air780eu-durable-counters')

          load_start = text.index('void loadCounters() {')
          load_end = text.index('\nvoid maintainCounterStorage()', load_start)
          text = text[:load_start] + '''void loadCounters() {
            memset(counters, 0, sizeof(counters));
            prefs.begin("dallmayr", true);
            uint16_t storedCount = prefs.getUShort("counter_n", 0);
            size_t len = prefs.getBytesLength("counters");
            const bool countValid = storedCount <= MAX_COUNTERS;
            const bool blobValid = (storedCount == 0)
              ? (len == 0 || len == sizeof(counters))
              : (len == sizeof(counters));

            if (countValid && len == sizeof(counters)) {
              prefs.getBytes("counters", counters, sizeof(counters));
            }
            prefs.end();

            if (!countValid || !blobValid) {
              // Counter values and counter_epoch form one logical contract with
              // the backend. Never reuse an old epoch after local counter
              // storage is missing/corrupt, otherwise a later vend can look
              // identical to the server's stale cumulative value.
              memset(counters, 0, sizeof(counters));
              counterCount = 0;
              makeRandomId(counterEpoch, sizeof(counterEpoch));
              saveCoreSettings();
              saveCountersNow();
              Serial.println(F("Counter storage invalid; counters cleared and counter epoch rotated."));
              return;
            }

            counterCount = storedCount;
          }
''' + text[load_end:]

          vend_start = text.index('void incrementLocalVend(')
          brace_start = text.index('{', vend_start)
          depth = 0
          vend_end = None
          for i in range(brace_start, len(text)):
            if text[i] == '{':
              depth += 1
            elif text[i] == '}':
              depth -= 1
              if depth == 0:
                vend_end = i + 1
                break
          if vend_end is None:
            raise RuntimeError('Could not locate incrementLocalVend body')
          vend = text[vend_start:vend_end]
          needle = '  c->dirty = true;\n  counterStorageDirty = true;\n'
          if needle not in vend:
            raise RuntimeError('Could not locate local-vend persistence marker')
          vend = vend.replace(
            needle,
            needle + '  saveCountersNow();  // durable before the machine can lose power\n',
            1,
          )
          text = text[:vend_start] + vend + text[vend_end:]

          status_needle = '  Serial.print(F("Counter epoch: ")); Serial.println(counterEpoch);'
          if status_needle not in text:
            raise RuntimeError('Could not locate Counter epoch status line')
          text = text.replace(
            status_needle,
            '  Serial.println(F("Counter persistence: immediate after local vend"));\n' + status_needle,
            1,
          )

          dst.parent.mkdir(parents=True, exist_ok=True)
          dst.write_text(text, encoding='utf-8')

          workflow = Path('.github/workflows/telemetry-firmware.yml')
          wf = workflow.read_text(encoding='utf-8')
          if 'firmware/DallmayrTelemetryV6_8_44' not in wf:
            raise RuntimeError('Telemetry workflow target changed unexpectedly')
          workflow.write_text(
            wf.replace('firmware/DallmayrTelemetryV6_8_44', 'firmware/DallmayrTelemetryV6_8_45'),
            encoding='utf-8',
          )

      - name: Commit generated firmware
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add firmware/DallmayrTelemetryV6_8_45/DallmayrTelemetryV6_8_45.ino .github/workflows/telemetry-firmware.yml
          git rm .github/workflows/generate-v6845.yml
          git commit -m "fix: persist MDB counters immediately in V6.8.45"
          git push origin HEAD:fix/durable-counter-persistence-v6845
