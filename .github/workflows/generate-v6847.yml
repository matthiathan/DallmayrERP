name: Generate V6.8.47 firmware

on:
  push:
    branches:
      - fix/cellular-stale-ppp-v6847
    paths:
      - scripts/generate_v6847.py
      - .github/workflows/generate-v6847.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: fix/cellular-stale-ppp-v6847

      - name: Generate firmware
        run: python3 scripts/generate_v6847.py

      - name: Commit generated V6.8.47 source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add firmware/DallmayrTelemetryV6_8_47/DallmayrTelemetryV6_8_47.ino
          if git diff --cached --quiet; then
            echo "Generated firmware already committed."
            exit 0
          fi
          git commit -m "fix: add V6.8.47 stale PPP recovery"
          git push origin HEAD:fix/cellular-stale-ppp-v6847
