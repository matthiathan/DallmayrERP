name: Internal Messaging Realtime Validation

on:
  pull_request:
    paths:
      - "supabase/migrations/20260805061000_enable_internal_messaging_realtime.sql"
      - "supabase/rollback/20260805061000_disable_internal_messaging_realtime.sql"
      - ".github/workflows/internal-messaging-realtime.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  postgres-realtime-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: messaging_realtime_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d messaging_realtime_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: messaging_realtime_test
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client
      - name: Apply messaging foundation
        run: |
          psql -v ON_ERROR_STOP=1 -f docs/internal-messaging/ci-fixtures.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20260804094500_add_internal_messaging_phase_1.sql
          psql -v ON_ERROR_STOP=1 -c "create publication supabase_realtime;"
      - name: Enable and verify Realtime publication
        run: |
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20260805061000_enable_internal_messaging_realtime.sql
          test "$(psql -Atq -c \"select count(*) from pg_publication_tables where pubname = 'supabase_realtime' and schemaname = 'public' and tablename in ('message_threads','message_thread_members','messages','message_read_positions')\")" = "4"
      - name: Verify idempotency
        run: |
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20260805061000_enable_internal_messaging_realtime.sql
          test "$(psql -Atq -c \"select count(*) from pg_publication_tables where pubname = 'supabase_realtime' and schemaname = 'public' and tablename in ('message_threads','message_thread_members','messages','message_read_positions')\")" = "4"
      - name: Verify rollback
        run: |
          psql -v ON_ERROR_STOP=1 -f supabase/rollback/20260805061000_disable_internal_messaging_realtime.sql
          test "$(psql -Atq -c \"select count(*) from pg_publication_tables where pubname = 'supabase_realtime' and schemaname = 'public' and tablename in ('message_threads','message_thread_members','messages','message_read_positions')\")" = "0"
          test "$(psql -Atq -c \"select count(*) from pg_tables where schemaname = 'public' and tablename in ('message_threads','message_thread_members','messages','message_read_positions')\")" = "4"
