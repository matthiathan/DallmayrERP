name: Revert mobile implementation

on:
  push:
    branches:
      - rollback/mobile-ground-up-final5
    paths:
      - '.github/workflows/revert-mobile-ground-up.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  revert-mobile:
    runs-on: ubuntu-latest
    steps:
      - name: Check out rollback branch
        uses: actions/checkout@v4
        with:
          ref: rollback/mobile-ground-up-final5
          fetch-depth: 0

      - name: Revert PR 207 merge commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git revert -m 1 97f5c00f09b879f7ad2010e619f357d2d7d1f080 --no-edit
          git push origin HEAD:rollback/mobile-ground-up-final5
