name: Generate V6.8.46 MDB fault recovery

on:
  push:
    branches:
      - fix/mdb-fault-recovery-v6846
    paths:
      - '.github/workflows/generate-v6846.yml'
      - 'scripts/generate_v6846.py'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: fix/mdb-fault-recovery-v6846

      - name: Generate V6.8.46 from V6.8.45
        run: python scripts/generate_v6846.py

      - name: Commit generated firmware
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add firmware/DallmayrTelemetryV6_8_46/DallmayrTelemetryV6_8_46.ino
          git commit -m "fix: clear stale MDB traffic faults after reboot"
          git push origin HEAD:fix/mdb-fault-recovery-v6846
