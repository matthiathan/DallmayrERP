name: DallmayrERP CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Typecheck, build and browser-test Next.js app
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://egbiiizxsqlarqpnzxxs.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: dummy-build-key

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Check feature flag contracts
        run: npm run feature:check

      - name: Check stylesheet architecture
        run: npm run stylecheck

      - name: Check mobile navigation and search contracts
        run: npm run mobile:interaction-check

      - name: Check responsive and accessibility contracts
        run: npm run accessibility:check

      - name: Check production and staged test harness syntax
        run: |
          node --check tests/production-visual.spec.mjs
          node --check tests/production-role-ui.spec.mjs
          node --check tests/messaging-staged.spec.mjs
          node --check scripts/validate-staged-messaging.mjs
          python -m py_compile scripts/compare-production-screenshots.py

      - name: Typecheck application
        run: npm run typecheck

      - name: Build application
        run: npm run build

      - name: Install mobile browser test runner and Chromium
        run: |
          npm install --no-save --no-package-lock --no-audit --no-fund @playwright/test@1.55.0
          npx playwright install --with-deps chromium

      - name: Run security and real-browser mobile tests against local production server
        shell: bash
        env:
          SECURITY_PENTEST_TARGET: http://localhost:3000
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
        run: |
          npm run start > next-server.log 2>&1 &
          server_pid="$!"

          cleanup() {
            kill "$server_pid" 2>/dev/null || true
            wait "$server_pid" 2>/dev/null || true
            if [ -f next-server.log ]; then
              tail -n 80 next-server.log
            fi
          }

          trap cleanup EXIT

          for attempt in {1..45}; do
            if curl -fsS "$SECURITY_PENTEST_TARGET/login" > /dev/null; then
              npm run security:pentest
              npx playwright test tests/mobile-login.spec.mjs --reporter=line
              exit 0
            fi
            sleep 2
          done

          cat next-server.log
          exit 1
