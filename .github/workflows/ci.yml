name: DallmayrERP CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Typecheck and build Next.js app
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://egbiiizxsqlarqpnzxxs.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: dummy-build-key

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Package source snapshot for audit
        run: |
          git ls-files -z | tar --null -T - -czf /tmp/dallmayrerp-source.tgz

      - name: Upload source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: repository-audit-source
          path: /tmp/dallmayrerp-source.tgz
          if-no-files-found: error
          retention-days: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Check stylesheet architecture
        run: npm run stylecheck

      - name: Typecheck application
        run: npm run typecheck

      - name: Build application
        run: npm run build
