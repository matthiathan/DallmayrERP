name: DallmayrERP Monday Item Card Bootstrap

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: monday-item-card-bootstrap-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  apply:
    name: Apply and validate Monday item card phase 3
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://egbiiizxsqlarqpnzxxs.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: dummy-build-key

    steps:
      - name: Checkout Phase 3 branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Apply staged item-card source
        run: |
          cat phase3-payload/part-*.b64 | base64 --decode > /tmp/phase3-source.tgz
          tar -xzf /tmp/phase3-source.tgz -C .
          rm -rf phase3-payload

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Check source whitespace
        run: git diff --check -- app/styles/index.css app/monday-item-card-phase-3.css components/boards/CustomerBoardWorkspace.tsx components/boards/CustomerBoardTable.tsx components/boards/CustomerItemCard.tsx

      - name: Check stylesheet architecture
        run: npm run stylecheck

      - name: Typecheck application
        run: npm run typecheck

      - name: Build application
        run: npm run build

      - name: Commit validated item-card source
        run: |
          rm -rf node_modules .next tsconfig.tsbuildinfo
          rm -f next-env.d.ts
          git config user.name 'DallmayrERP CI'
          git config user.email 'actions@users.noreply.github.com'
          git add -A phase3-payload
          git add app/styles/index.css app/monday-item-card-phase-3.css
          git add components/boards/CustomerBoardWorkspace.tsx components/boards/CustomerBoardTable.tsx components/boards/CustomerItemCard.tsx
          git commit -m 'Add Monday-style customer item-card drawer'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
