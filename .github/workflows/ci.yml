name: DallmayrERP Phase 4 Hardening Bootstrap

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: phase4-hardening-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  apply:
    name: Apply and validate Phase 4 hardening
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://egbiiizxsqlarqpnzxxs.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: dummy-build-key

    steps:
      - name: Checkout hardening branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Apply staged hardening source
        run: |
          cat phase4-hardening-payload/part-*.b64 | base64 --decode > /tmp/phase4-hardening.tgz
          tar -xzf /tmp/phase4-hardening.tgz -C .
          rm -rf phase4-hardening-payload

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Check source whitespace
        run: git diff --check -- components/features/EnterpriseServiceJobBoard.tsx app/monday-operational-views-phase-4.css

      - name: Check stylesheet architecture
        run: npm run stylecheck

      - name: Typecheck application
        run: npm run typecheck

      - name: Build application
        run: npm run build

      - name: Commit validated hardening source
        run: |
          rm -rf node_modules .next tsconfig.tsbuildinfo
          rm -f next-env.d.ts
          git config user.name 'DallmayrERP CI'
          git config user.email 'actions@users.noreply.github.com'
          git add -A phase4-hardening-payload
          git add components/features/EnterpriseServiceJobBoard.tsx app/monday-operational-views-phase-4.css
          git commit -m 'Harden Monday-style operational views'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
