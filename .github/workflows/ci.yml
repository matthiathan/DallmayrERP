name: DallmayrERP CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Typecheck and build Next.js app
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://egbiiizxsqlarqpnzxxs.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: dummy-build-key

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Check stylesheet architecture
        run: npm run stylecheck

      - name: Typecheck application
        run: npm run typecheck

      - name: Build application
        run: npm run build

      - name: Run security pentest against local production server
        shell: bash
        env:
          SECURITY_PENTEST_TARGET: http://localhost:3000
        run: |
          npm run start > next-server.log 2>&1 &
          server_pid="$!"

          cleanup() {
            kill "$server_pid" 2>/dev/null || true
            wait "$server_pid" 2>/dev/null || true
            if [ -f next-server.log ]; then
              tail -n 80 next-server.log
            fi
          }

          trap cleanup EXIT

          for attempt in {1..45}; do
            if curl -fsS "$SECURITY_PENTEST_TARGET/login" > /dev/null; then
              npm run security:pentest
              exit 0
            fi
            sleep 2
          done

          cat next-server.log
          exit 1
