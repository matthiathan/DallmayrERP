name: Align mobile page-title hierarchy

on:
  push:
    branches:
      - fix/mobile-telemetry-experience-20260907
    paths:
      - '.github/workflows/patch-mobile-page-title-contract.yml'
      - 'scripts/patch_mobile_page_title_contract.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/mobile-telemetry-experience-20260907
      - run: python scripts/patch_mobile_page_title_contract.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/layout/AppShell.tsx scripts/check-mobile-interactions.mjs
          git commit -m "fix: preserve page-owned mobile title hierarchy"
          git push origin HEAD:fix/mobile-telemetry-experience-20260907
