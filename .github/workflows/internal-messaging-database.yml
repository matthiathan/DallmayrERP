name: Internal Messaging Database Validation

on:
  pull_request:
    paths:
      - "docs/internal-messaging/**"
      - "supabase/migrations/20260804094500_add_internal_messaging_phase_1.sql"
      - "supabase/rollback/20260804094500_remove_internal_messaging_phase_1.sql"
      - ".github/workflows/internal-messaging-database.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  postgres-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: messaging_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d messaging_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: messaging_test

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client

      - name: Apply disposable fixtures and migration
        run: |
          psql -v ON_ERROR_STOP=1 -f docs/internal-messaging/ci-fixtures.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20260804094500_add_internal_messaging_phase_1.sql

      - name: Run positive RLS and contract tests
        run: psql -v ON_ERROR_STOP=1 -f docs/internal-messaging/ci-tests.sql

      - name: Verify non-member send is rejected
        shell: bash
        run: |
          thread_id=$(psql -Atq -c "select id from public.message_threads where direct_key = '00000000-0000-0000-0000-000000000001:00000000-0000-0000-0000-000000000002'")
          test -n "$thread_id"
          set +e
          output=$(psql -v ON_ERROR_STOP=1 -v thread_id="$thread_id" 2>&1 <<'SQL'
          set role authenticated;
          select set_config('request.jwt.claim.sub', '10000000-0000-0000-0000-000000000003', false);
          insert into public.messages (thread_id, body, client_message_id)
          values (:'thread_id'::uuid, 'unauthorized', '20000000-0000-0000-0000-000000000002'::uuid);
          SQL
          )
          status=$?
          set -e
          test "$status" -ne 0
          echo "$output" | grep -qi "row-level security"

      - name: Verify sender impersonation is rejected
        shell: bash
        run: |
          thread_id=$(psql -Atq -c "select id from public.message_threads where direct_key = '00000000-0000-0000-0000-000000000001:00000000-0000-0000-0000-000000000002'")
          test -n "$thread_id"
          set +e
          output=$(psql -v ON_ERROR_STOP=1 -v thread_id="$thread_id" 2>&1 <<'SQL'
          set role authenticated;
          select set_config('request.jwt.claim.sub', '10000000-0000-0000-0000-000000000001', false);
          insert into public.messages (thread_id, sender_id, body, client_message_id)
          values (
            :'thread_id'::uuid,
            '00000000-0000-0000-0000-000000000002'::uuid,
            'impersonation',
            '20000000-0000-0000-0000-000000000003'::uuid
          );
          SQL
          )
          status=$?
          set -e
          test "$status" -ne 0
          echo "$output" | grep -qi "row-level security"

      - name: Verify inactive caller is rejected
        shell: bash
        run: |
          set +e
          output=$(psql -v ON_ERROR_STOP=1 2>&1 <<'SQL'
          set role authenticated;
          select set_config('request.jwt.claim.sub', '10000000-0000-0000-0000-000000000004', false);
          select public.create_direct_message_thread('00000000-0000-0000-0000-000000000001');
          SQL
          )
          status=$?
          set -e
          test "$status" -ne 0
          echo "$output" | grep -qi "not active"

      - name: Verify concurrent direct-thread creation is idempotent
        shell: bash
        run: |
          rm -f /tmp/thread-a /tmp/thread-c

          psql -Atq <<'SQL' > /tmp/thread-a &
          set role authenticated;
          select set_config('request.jwt.claim.sub', '10000000-0000-0000-0000-000000000001', false);
          select public.create_direct_message_thread('00000000-0000-0000-0000-000000000003');
          SQL
          pid_a=$!

          psql -Atq <<'SQL' > /tmp/thread-c &
          set role authenticated;
          select set_config('request.jwt.claim.sub', '10000000-0000-0000-0000-000000000003', false);
          select public.create_direct_message_thread('00000000-0000-0000-0000-000000000001');
          SQL
          pid_c=$!

          wait "$pid_a"
          wait "$pid_c"

          thread_a=$(tail -n 1 /tmp/thread-a | tr -d '[:space:]')
          thread_c=$(tail -n 1 /tmp/thread-c | tr -d '[:space:]')

          test -n "$thread_a"
          test "$thread_a" = "$thread_c"

          count=$(psql -Atq -c "select count(*) from public.message_threads where direct_key = '00000000-0000-0000-0000-000000000001:00000000-0000-0000-0000-000000000003'")
          members=$(psql -Atq -c "select count(*) from public.message_thread_members where thread_id = '$thread_a'::uuid and removed_at is null")
          test "$count" = "1"
          test "$members" = "2"

      - name: Verify anonymous function access is denied
        shell: bash
        run: |
          set +e
          output=$(psql -v ON_ERROR_STOP=1 2>&1 <<'SQL'
          set role anon;
          select public.create_direct_message_thread('00000000-0000-0000-0000-000000000001');
          SQL
          )
          status=$?
          set -e
          test "$status" -ne 0
          echo "$output" | grep -qi "permission denied"

      - name: Verify rollback removes only messaging objects
        run: |
          psql -v ON_ERROR_STOP=1 -f supabase/rollback/20260804094500_remove_internal_messaging_phase_1.sql
          test "$(psql -Atq -c "select count(*) from pg_tables where schemaname = 'public' and tablename like 'message%'")" = "0"
          test "$(psql -Atq -c "select count(*) from information_schema.routines where routine_schema = 'public' and routine_name in ('create_direct_message_thread', 'create_group_message_thread')")" = "0"
          test "$(psql -Atq -c "select count(*) from information_schema.tables where table_schema = 'public' and table_name = 'users'")" = "1"
